name: mapbox_kit_example
description: "mapbox_kit example: Standard style tour and turn-by-turn navigation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0-192.0.dev

# Plain version deps: `dn pub get` resolves DartNative packages from your
# installed SDK (closed resolution) — no registry setup, works offline.
dependencies:
  mapbox_kit:
    path: ../
  image: ^4.0.0
  dartnative: ^1.0.0
  dartnative_ios: ^1.0.0
  dartnative_android: ^1.0.0
  dartnative_skia: ^1.0.0
  # Spoken turn-by-turn guidance: on-device SuperTonic-3 TTS (pure Dart on
  # ONNX Runtime) played through the native PCM stream player.
  dartnative_supertonic_tts: ^1.0.0
  dartnative_onnxruntime: ^1.0.0
  dartnative_path_provider: ^1.0.0
  dartnative_audio: ^1.0.0

dev_dependencies:
  lints: ^6.0.0

dartnative_skia:
  variant: full

dartnative:
  assets:
    - assets/dn-logo.png

# Branded launch splash + app icon: add the dartnative_splash plugin from
# dartpub.dev, then see tool/generate_app_assets.dart.
